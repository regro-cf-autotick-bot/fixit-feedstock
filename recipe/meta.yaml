{% set name = "fixit" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fixit-{{ version }}.tar.gz
  sha256: ad22aea501f332eb46a316a1d409c384fd6f1e9fb5df7e89a0a74603814d8935

build:
  entry_points:
    - fixit = fixit.cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - click >=8.0,<8.2
    - libcst >=0.3.18
    - moreorless >=0.4.0
    - packaging >=21
    - tomli >=2.0
    - trailrunner >=1.2

test:
  imports:
    - fixit
  commands:
    - pip check
    - fixit --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Instagram/Fixit
  summary: A lint framework that writes better Python code for you.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - apmorton
